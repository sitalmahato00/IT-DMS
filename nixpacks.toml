[phases.setup]
nixpkgsArchive = ["{{ nixpkgs_23_11 }}"]

[phases.build]
cmds = ["composer install --no-dev --optimize-autoloader", "npm ci", "npm run build", "php artisan config:cache", "php artisan route:cache", "chmod -R 755 storage bootstrap/cache"]

[start]
command = "php artisan serve --host=0.0.0.0 --port=${PORT:-8000}"
